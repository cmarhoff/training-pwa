<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trainings-App</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <div id="container">
    <h1 id="exercise"></h1>
    <p id="info"></p>

    <div id="animation" aria-hidden="true">
      <svg id="stickFigure" viewBox="0 0 320 220" role="img">
        <line id="ground" x1="25" y1="198" x2="295" y2="198"></line>
        <circle id="figureHead" r="12"></circle>
        <line id="figureTorso"></line>
        <polyline id="figureLeftArm"></polyline>
        <polyline id="figureRightArm"></polyline>
        <polyline id="figureLeftLeg"></polyline>
        <polyline id="figureRightLeg"></polyline>
      </svg>
    </div>

    <p id="time"></p>
    <button id="startBtn">Los geht's!</button>
    <button id="restartBtn">Neu starten</button>
  </div>

  <script src="data.js"></script>
  <script src="animation.js?v=6"></script>
  <script src="app.js"></script>
</body>
</html>
